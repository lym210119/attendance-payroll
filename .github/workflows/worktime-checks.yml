name: WorkTime checks
on:
  push:
    branches: [saas-mvp]
    paths:
      - 'worktime/**'
      - '.github/workflows/worktime-checks.yml'
  pull_request:
    branches: [saas-mvp]
    paths:
      - 'worktime/**'
      - '.github/workflows/worktime-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worktime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
