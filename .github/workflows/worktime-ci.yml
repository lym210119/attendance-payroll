name: WorkTime SaaS CI

on:
  push:
    branches:
      - saas-mvp
    paths:
      - "worktime/**"
      - ".github/workflows/worktime-ci.yml"
  pull_request:
    branches:
      - saas-mvp
    paths:
      - "worktime/**"
      - ".github/workflows/worktime-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worktime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
