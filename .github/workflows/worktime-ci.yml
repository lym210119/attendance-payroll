name: WorkTime SaaS CI

on:
  push:
    branches:
      - saas-mvp
    paths:
      - "worktime/**"
      - ".github/workflows/worktime-ci.yml"
  pull_request:
    branches:
      - saas-mvp
    paths:
      - "worktime/**"
      - ".github/workflows/worktime-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worktime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: npm audit --json > npm-audit.json || node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'fixAvailable:', JSON.stringify(v.fixAvailable)); console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities));"
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
